<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in / BoityTwitter</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('boity-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>

  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-soft);
    }

    .login-card {
      background-color: var(--bg);
      width: 100%;
      max-width: 380px;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .login-card .bi-twitter {
      font-size: 40px;
      color: var(--blue);
    }

    .login-card h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 16px 0 24px 0;
    }

    .login-card input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid var(--input-border);
      background-color: var(--bg);
      color: var(--text);
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    .login-card input:focus {
      border-color: var(--blue);
    }

    .login-card .tweet-btn {
      width: 100%;
      margin-top: 4px;
    }

    .login-links {
      margin-top: 18px;
      font-size: 14px;
    }

    .login-links a {
      color: var(--blue);
      text-decoration: none;
    }

    .login-links a:hover {
      text-decoration: underline;
    }

    .login-theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      width: auto;
    }
  </style>
</head>
<body>

  <button type="button" class="nav-item theme-toggle login-theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
    <span class="theme-switch" aria-hidden="true"><span class="theme-switch-knob"></span></span>
    <span class="theme-label">Dark mode</span>
  </button>

  <div class="login-page">
    <div class="login-card">
      <i class="bi bi-twitter"></i>
      <h1>Sign in to BoityTwitter</h1>

      <form action="index.html">
        <input type="text" placeholder="Phone, email or username" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="tweet-btn">Log in</button>
      </form>

      <div class="login-links">
        <a href="#">Forgot password?</a> &middot;
        <a href="#">Sign up for BoityTwitter</a>
      </div>
      <div class="login-links">
        <a href="index.html">&larr; back to timeline</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
